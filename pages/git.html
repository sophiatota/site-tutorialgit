                        <h2 class="titulo-secao">O que é o Git?</h2>
                        <article class="card">

                        <p>
                            O <b>Git</b> é um sistema de controle de versão que permite acompanhar 
                            as alterações feitas nos arquivos de um projeto, salvar diferentes 
                            versões e organizar o desenvolvimento de códigos. Com ele, é possível 
                            consultar o histórico de modificações, comparar versões, recuperar arquivos 
                            anteriores e trabalhar em equipe sem perder o controle das mudanças realizadas. 
                            É muito utilizado por programadores para desenvolver e manter projetos de forma 
                            organizada e segura.
                        </p>
                        </div>

                                    diferentes países, mostrando como o compartilhamento de conhecimento pode impulsionar a
